<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Electricity Manager</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <script src="script.js" defer></script>
    <script src="pdf.js" defer></script>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>⚡ Room Manager</h2>
                <button id="addRoomBtn" class="btn-primary" title="Add New Room">➕ Add Room</button>
            </div>
            <div class="sidebar-controls">
                <input type="text" id="searchInput" placeholder="🔍 Search rooms...">
                <div class="filter-sort-group">
                    <select id="sortSelect">
                        <option value="asc">Sort A-Z</option>
                        <option value="desc">Sort Z-A</option>
                    </select>
                    <select id="filterSelect">
                        <option value="all">All Rooms</option>
                        <option value="completed">Completed</option>
                        <option value="pending">Pending</option>
                    </select>
                </div>
            </div>
            <ul id="roomList" class="room-list">
                </ul>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div class="auto-save-indicator">
                    <span id="saveStatus">✔️ All changes saved</span>
                    <small id="lastSavedTime">Last saved: Just now</small>
                </div>
                <div class="topbar-actions">
                    <button id="exportBtn" class="btn-secondary">💾 Export JSON</button>
                    <label for="importInput" class="btn-secondary import-label">📂 Import JSON</label>
                    <input type="file" id="importInput" accept=".json" style="display: none;">
                    <button id="clearAllBtn" class="btn-danger">🗑️ Clear All Data</button>
                    <button id="themeToggle" class="btn-icon">🌙</button>
                </div>
            </header>

            <section class="dashboard card">
                <div class="stats-grid">
                    <div class="stat-box">Total Rooms <strong id="totalRooms">0</strong></div>
                    <div class="stat-box completed-text">Completed <strong id="completedRooms">0</strong></div>
                    <div class="stat-box pending-text">Pending <strong id="pendingRooms">0</strong></div>
                    <div class="stat-box">Progress <strong id="progressText">0%</strong></div>
                </div>
                <div class="progress-bar-container">
                    <div id="progressBar" class="progress-bar" style="width: 0%;"></div>
                </div>
            </section>

            <section id="roomEditor" class="room-editor card" style="display: none;">
                <div class="room-header">
                    <div class="room-title-group">
                        <h3 id="currentRoomTitle">Room</h3>
                        <input type="text" id="roomNameInput" placeholder="Enter Room Number (e.g., 101)">
                    </div>
                    <div class="room-actions">
                        <button id="duplicateRoomBtn" class="btn-secondary">📑 Duplicate</button>
                        <button id="clearRoomBtn" class="btn-secondary">🧹 Clear Room</button>
                        <button id="deleteRoomBtn" class="btn-danger">🗑️ Delete Room</button>
                    </div>
                </div>

                <div class="table-responsive">
                    <table id="appliancesTable">
                        <thead>
                            <tr>
                                <th>Appliance</th>
                                <th>Quantity</th>
                                <th>Star Rating</th>
                                <th>Hours Per Day</th>
                            </tr>
                        </thead>
                        <tbody id="appliancesBody">
                            </tbody>
                    </table>
                </div>

                <div class="bill-section">
                    <label for="monthlyBill">Average Monthly Electricity Bill (₹):</label>
                    <input type="number" id="monthlyBill" placeholder="Enter amount" min="0">
                </div>

                <div class="editor-footer">
                    <div class="nav-buttons">
                        <button id="prevRoomBtn" class="btn-secondary">⬅️ Previous</button>
                        <button id="nextRoomBtn" class="btn-secondary">Next ➡️</button>
                    </div>
                    <div class="action-buttons">
                        <button id="saveBtn" class="btn-secondary">💾 Save</button>
                        <button id="printBtn" class="btn-secondary">🖨️ Print Current</button>
                        <button id="generatePdfBtn" class="btn-primary">📄 Generate PDF (All)</button>
                    </div>
                </div>
            </section>
            
            <div id="emptyState" class="empty-state">
                <h2>No Rooms Available</h2>
                <p>Click "Add Room" in the sidebar to get started.</p>
            </div>
        </main>
    </div>

    <div id="toastContainer" class="toast-container"></div>
</body>
</html>
